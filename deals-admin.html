<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1Shopping — Deals Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
    .row { display: grid; gap: 10px; margin-bottom: 16px; }
    .banner-form {
      border: 1px solid #d5dce3;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      background: #fbfcfd;
    }
    label { display: block; font-size: 13px; color: #5a6570; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d5dce3;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    button, .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #0f8a6b;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #12151a; }
    button.danger { background: #b3261e; }
    pre {
      background: #12151a;
      color: #e7ecf1;
      border-radius: 12px;
      padding: 14px;
      overflow: auto;
      font-size: 12px;
    }
    .hint { color: #5a6570; font-size: 14px; line-height: 1.45; }
    .preview {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 10px;
      background: #dee4ea;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">1Shopping</a>
    <nav>
      <a href="deals.json">deals.json</a>
      <a href="index.html">Legal</a>
    </nav>
  </header>

  <main class="admin">
    <h1>Deals admin</h1>
    <p class="hint">
      Edit banners here, then click <strong>Download deals.json</strong> and replace
      <code>store_pages/deals.json</code> in the repo. Run
      <code>publish-to-github.ps1</code> so the app picks them up from GitHub Pages.
    </p>

    <div class="actions">
      <button type="button" id="add">Add banner</button>
      <button type="button" class="secondary" id="load">Reload from deals.json</button>
      <button type="button" id="download">Download deals.json</button>
    </div>

    <div id="list"></div>

    <h2>Preview JSON</h2>
    <pre id="json"></pre>
  </main>

  <script>
    const listEl = document.getElementById('list');
    const jsonEl = document.getElementById('json');
    let banners = [];

    function uid() {
      return 'deal-' + Math.random().toString(36).slice(2, 9);
    }

    function emptyBanner() {
      return {
        id: uid(),
        title: '',
        subtitle: '',
        imageUrl: '',
        linkUrl: '',
        enabled: true,
        order: banners.length + 1
      };
    }

    function syncJson() {
      const payload = {
        updatedAt: new Date().toISOString().slice(0, 10),
        banners: banners.map((b, i) => ({ ...b, order: i + 1 }))
      };
      jsonEl.textContent = JSON.stringify(payload, null, 2);
      return payload;
    }

    function render() {
      listEl.innerHTML = '';
      banners.forEach((b, index) => {
        const box = document.createElement('div');
        box.className = 'banner-form';
        box.innerHTML = `
          <div class="row">
            <div><label>Title</label><input data-k="title" value="${escapeAttr(b.title)}" /></div>
            <div><label>Subtitle</label><input data-k="subtitle" value="${escapeAttr(b.subtitle)}" /></div>
            <div><label>Image URL</label><input data-k="imageUrl" value="${escapeAttr(b.imageUrl)}" /></div>
            <div><label>Link URL (affiliate / store)</label><input data-k="linkUrl" value="${escapeAttr(b.linkUrl)}" /></div>
            <div><label><input type="checkbox" data-k="enabled" ${b.enabled ? 'checked' : ''}/> Enabled</label></div>
            ${b.imageUrl ? `<img class="preview" src="${escapeAttr(b.imageUrl)}" alt="" />` : ''}
            <div class="actions">
              <button type="button" class="secondary" data-up>Up</button>
              <button type="button" class="secondary" data-down>Down</button>
              <button type="button" class="danger" data-del>Delete</button>
            </div>
          </div>`;
        box.querySelectorAll('input').forEach((input) => {
          input.addEventListener('input', () => {
            const key = input.dataset.k;
            if (key === 'enabled') banners[index].enabled = input.checked;
            else banners[index][key] = input.value;
            syncJson();
            if (key === 'imageUrl') render();
          });
        });
        box.querySelector('[data-del]').onclick = () => {
          banners.splice(index, 1);
          render();
        };
        box.querySelector('[data-up]').onclick = () => {
          if (index === 0) return;
          [banners[index - 1], banners[index]] = [banners[index], banners[index - 1]];
          render();
        };
        box.querySelector('[data-down]').onclick = () => {
          if (index >= banners.length - 1) return;
          [banners[index + 1], banners[index]] = [banners[index], banners[index + 1]];
          render();
        };
        listEl.appendChild(box);
      });
      syncJson();
    }

    function escapeAttr(s) {
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('"', '&quot;')
        .replaceAll('<', '&lt;');
    }

    async function loadRemote() {
      try {
        const res = await fetch('deals.json?t=' + Date.now());
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        banners = Array.isArray(data.banners) ? data.banners : [];
      } catch (e) {
        banners = [emptyBanner()];
        alert('Could not load deals.json — starting empty. ' + e);
      }
      render();
    }

    document.getElementById('add').onclick = () => {
      banners.push(emptyBanner());
      render();
    };
    document.getElementById('load').onclick = loadRemote;
    document.getElementById('download').onclick = () => {
      const payload = syncJson();
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'deals.json';
      a.click();
      URL.revokeObjectURL(a.href);
    };

    loadRemote();
  </script>
</body>
</html>
